<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deal Screener</title>
<style>
:root{
  --bg:#0B0D10; --panel:#15181D; --panel2:#191C22; --line:#2A2F37; --line2:#3A4049;
  --text:#F2F3F5; --muted:#9AA0AA; --dim:#5F6670;
  --green:#3DDC97; --green2:#5BE3A8; --blue:#5B8CFF; --amber:#F6D365; --orange:#FFA94D;
  --red:#FF453A; --purple:#A78BFA; --teal:#4FD1C5;
  --radius:12px; --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Helvetica,Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 var(--font);color-scheme:dark;-webkit-font-smoothing:antialiased}
a{color:var(--green2);text-decoration:none}a:hover{text-decoration:underline}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
h1{font-size:22px;font-weight:650;letter-spacing:-.01em;margin:0}
h2{font-size:15px;font-weight:600;margin:0;letter-spacing:-.005em}
.wrap{max-width:1500px;margin:0 auto;padding:20px 16px 80px}
header{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between;margin-bottom:18px}
.sub{color:var(--muted);font-size:13px;margin-top:4px}
.badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:600;letter-spacing:.02em;text-transform:uppercase;line-height:1.6}
.badge.ok{background:rgba(61,220,151,.14);color:var(--green)}
.badge.warn{background:rgba(246,211,101,.14);color:var(--amber)}
.badge.bad{background:rgba(255,69,58,.16);color:#ff7a70}
.badge.gray{background:rgba(154,160,170,.14);color:var(--muted)}
.badge.est{background:rgba(124,196,255,.14);color:#7cc4ff}
.errs{color:var(--amber);font-size:12px;margin-top:6px;white-space:pre-wrap;max-width:720px}
.errs b{color:var(--amber)}
.badge.blue{background:rgba(91,140,255,.16);color:#8fb0ff}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:18px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px}
.stat .k{color:var(--muted);font-size:12px}
.stat .v{font-size:24px;font-weight:650;letter-spacing:-.02em;margin-top:2px;font-variant-numeric:tabular-nums}
.stat .v small{font-size:12px;color:var(--muted);font-weight:500;margin-left:6px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:14px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row.between{justify-content:space-between}
select,input[type=text],input[type=number],input[type=date]{background:var(--panel2);border:1px solid var(--line2);border-radius:8px;padding:6px 8px;min-height:32px;color:var(--text)}
select:focus,input:focus{outline:none;border-color:var(--blue)}
.btn{background:var(--panel2);border:1px solid var(--line2);border-radius:8px;padding:6px 11px;min-height:32px;color:var(--text)}
.btn:hover{border-color:var(--dim);background:#1E2229}
.btn.primary{background:var(--green);color:#06120C;border-color:var(--green);font-weight:600}
.btn.primary:hover{background:var(--green2)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--text);background:var(--panel2)}
.btn.danger{color:#ff7a70}
.btn.small{padding:3px 8px;min-height:26px;font-size:12px}
.group{border:1px dashed var(--line2);border-radius:10px;padding:10px;margin-top:8px;position:relative}
.group .glabel{position:absolute;top:-9px;left:10px;background:var(--panel);padding:0 6px;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.cond{display:grid;grid-template-columns:minmax(180px,1.4fr) minmax(120px,.8fr) minmax(140px,1fr) 32px;gap:6px;margin-top:6px}
.cond:first-of-type{margin-top:4px}
.multi{display:flex;flex-wrap:wrap;gap:4px 12px;padding:4px 2px;font-size:13px}
.multi label{display:inline-flex;align-items:center;gap:4px;white-space:nowrap;cursor:pointer}
.or{color:var(--amber);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;margin:10px 0 2px}
.hint{color:var(--muted);font-size:12px}
.section{margin-top:18px}
.section-h{display:flex;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap}
.section-h .count{color:var(--muted);font-weight:500}
.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--panel)}
table{border-collapse:collapse;width:100%;min-width:1100px}
th,td{padding:8px 10px;text-align:left;white-space:nowrap;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
th{position:sticky;top:0;background:var(--panel2);font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;cursor:pointer;user-select:none;z-index:1}
th:hover{color:var(--text)}
th.sorted{color:var(--green)}
th .arrow{font-size:9px;margin-left:3px}
tbody tr{cursor:pointer}
tbody tr:hover{background:#1A1E25}
tbody tr.selected{background:#1C2430}
td.num{text-align:right}th.num{text-align:right}
td .addr{font-weight:600}
td .addr2{color:var(--muted);font-size:12px}
td.blank{color:var(--dim)}
.missing{color:var(--amber);font-size:12px;white-space:normal;max-width:260px}
.pager{display:flex;gap:8px;align-items:center;justify-content:flex-end;padding:8px 10px;color:var(--muted);font-size:12px}
.empty{padding:28px;text-align:center;color:var(--muted)}
details summary{cursor:pointer;color:var(--muted);font-size:13px;padding:6px 0}
details summary:hover{color:var(--text)}
.list{list-style:none;margin:0;padding:0;max-height:420px;overflow:auto;border:1px solid var(--line);border-radius:8px}
.list li{padding:8px 10px;border-top:1px solid var(--line);font-size:13px;display:grid;grid-template-columns:150px 1fr;gap:10px}
.list li:first-child{border-top:0}
.list .m{color:var(--muted);font-size:12px}
.runbars{display:flex;gap:3px;align-items:flex-end;height:34px}
.runbars div{width:9px;background:var(--line2);border-radius:2px 2px 0 0;position:relative}
.runbars div.bad{background:var(--red)}
.runbars div.ok{background:var(--green)}
.runbars div[title]:hover{opacity:.8}
/* drawer */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;z-index:9}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(720px,100vw);background:var(--panel);border-left:1px solid var(--line);transform:translateX(100%);transition:transform .18s ease;z-index:10;overflow:auto;padding:18px 20px 40px}
.drawer.open{transform:none}.overlay.open{display:block}
.drawer h3{margin:18px 0 8px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.kv{display:grid;grid-template-columns:170px 1fr;gap:4px 12px;font-size:13px}
.kv .k{color:var(--muted)}
.kv .v{font-variant-numeric:tabular-nums}
.kv .ev{grid-column:2;color:var(--muted);font-size:12px;font-style:italic;margin:-2px 0 4px;border-left:2px solid var(--line2);padding-left:8px;white-space:normal}
.kv .ev.none{color:var(--orange);font-style:normal}
.warn-list li{color:var(--amber)}
.issue-list li{color:#ff9a93}
pre.excerpt{white-space:pre-wrap;font:12px/1.5 var(--mono);color:var(--muted);background:var(--bg);padding:10px;border-radius:8px;max-height:260px;overflow:auto;margin:0}
.close{position:absolute;top:12px;right:14px}
.pill{display:inline-block;padding:1px 7px;border-radius:6px;background:var(--panel2);border:1px solid var(--line2);font-size:12px;margin:2px 4px 2px 0}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line2);padding:8px 14px;border-radius:10px;font-size:13px;display:none;z-index:20}
#loading{padding:60px;text-align:center;color:var(--muted)}
.grade{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:7px;font-weight:700;font-size:13px}
.grade.A{background:rgba(61,220,151,.18);color:var(--green)}.grade.B{background:rgba(91,140,255,.18);color:#8fb0ff}
.grade.C{background:rgba(246,211,101,.16);color:var(--amber)}.grade.D{background:rgba(255,69,58,.16);color:#ff7a70}
.grade.NA{background:rgba(154,160,170,.12);color:var(--muted)}
#tip{position:fixed;z-index:30;max-width:320px;background:#232831;color:var(--text);border:1px solid var(--line2);border-radius:8px;padding:8px 10px;font-size:12.5px;line-height:1.45;box-shadow:0 6px 24px rgba(0,0,0,.45);pointer-events:none;opacity:0;transition:opacity .08s;text-transform:none;letter-spacing:0;font-weight:400;white-space:normal;left:-9999px;top:0}
#tip.on{opacity:1}
[data-tip]{cursor:help}
th[data-tip],button[data-tip],select[data-tip],a[data-tip]{cursor:pointer}
.diff{color:var(--orange);font-weight:600}
@media (max-width:700px){.cond{grid-template-columns:1fr 1fr;} .cond select:first-child{grid-column:1/-1} .kv{grid-template-columns:1fr} .kv .ev{grid-column:1}}
</style>
</head>
<body>
<div class="wrap">
<div id="loading">Unpacking archive…</div>
<div id="app" style="display:none">
  <header>
    <div>
      <h1>Deal Screener</h1>
      <div class="sub" id="runline"></div>
      <div class="errs" id="runerrs" style="display:none"></div>
    </div>
    <div class="row">
      <div class="runbars" id="runbars" data-tip="The last 30 runs. Bar height = emails seen. Red = that run had a failure. Hover a bar for its numbers."></div>
    </div>
  </header>

  <div class="stats" id="stats"></div>

  <div class="panel">
    <div class="row between">
      <div class="row">
        <h2>Showing</h2>
        <select id="scope" data-tip="Which listings to show, by the date their email arrived. 'Latest run' = only what the most recent run found. 'All time' = the whole archive, back to day one.">
          <option value="latest">Latest run</option>
          <option value="today">Today</option>
          <option value="7">Last 7 days</option>
          <option value="30">Last 30 days</option>
          <option value="90">Last 90 days</option>
          <option value="all">All time</option>
          <option value="custom">Custom range…</option>
        </select>
        <span id="customrange" style="display:none" class="row">
          <input type="date" id="from"> <span class="hint">to</span> <input type="date" id="to">
        </span>
        <span class="hint" id="scopehint"></span>
      </div>
      <div class="row">
        <label class="hint" data-tip="Listings that failed a sanity check (a number not found in the email, a price out of range…) are held in 'Couldn't read / needs review' by default. Tick this to run your filter over them too."><input type="checkbox" id="inclreview"> include "needs review" listings in filtering</label>
      </div>
    </div>
  </div>

  <div class="panel">
    <div class="row between">
      <div class="row">
        <h2>Filter</h2>
        <span class="hint">conditions inside a group are AND; groups are OR. Nothing is pre-set.</span>
      </div>
      <div class="row">
        <button class="btn small" id="clearbtn" data-tip="Remove every condition and reset the page to how it opens: latest run, no filter, default sort.">Clear</button>
        <select id="savedsets" data-tip="Load a filter set you saved earlier. Saved sets live in this browser on this device; use Export to back them up."><option value="">Saved sets…</option></select>
        <button class="btn small" id="savebtn" data-tip="Save the current conditions under a name, in this browser.">Save as…</button>
        <button class="btn small" id="deletebtn" data-tip="Delete the saved set selected on the left.">Delete</button>
        <button class="btn small" id="exportbtn" data-tip="Download all your saved sets as a file, to back them up or move them to another browser or device.">Export</button>
        <button class="btn small" id="importbtn" data-tip="Load saved sets from a file you exported earlier. Sets with the same name are replaced.">Import</button>
        <input type="file" id="importfile" accept="application/json" style="display:none">
      </div>
    </div>
    <div id="groups"></div>
    <div class="row" style="margin-top:10px">
      <button class="btn small" id="addgroup" data-tip="Add an alternative set of conditions. A listing matches if it passes ALL conditions in ANY one group.">+ OR group</button>
      <span class="hint" id="filterstate"></span>
    </div>
  </div>

  <div class="section" id="sec-matches">
    <div class="section-h"><h2 data-tip="Listings that pass every condition in at least one group. With no filter, everything in the date range.">Matches current filter</h2><span class="count" id="c-matches"></span></div>
    <div class="tablewrap"><table id="t-matches"></table><div class="pager" id="p-matches"></div></div>
  </div>

  <div class="section" id="sec-missing">
    <div class="section-h"><h2 data-tip="Your filter needed a field these listings don't have, because the email never stated it. They aren't rejected; check them by hand. The last column says which field was missing.">Missing data</h2><span class="count" id="c-missing"></span><span class="hint">a condition needed a field this listing doesn't have — not a reject</span></div>
    <div class="tablewrap"><table id="t-missing"></table><div class="pager" id="p-missing"></div></div>
  </div>

  <div class="section" id="sec-review">
    <div class="section-h"><h2 data-tip="Listings that failed a plain-code check (each one says why), emails that couldn't be read at all, and listing links that wouldn't load.">Couldn't read / needs review</h2><span class="count" id="c-review"></span></div>
    <div class="panel" id="review-panel"></div>
  </div>

  <div class="section">
    <details><summary id="s-rejects"></summary><div class="tablewrap" style="margin-top:8px"><table id="t-rejects"></table><div class="pager" id="p-rejects"></div></div></details>
    <details><summary id="s-skipped"></summary><div class="panel" id="skipped-panel" style="margin-top:8px"></div></details>
    <details><summary id="s-noprop"></summary><div class="panel" id="noprop-panel" style="margin-top:8px"></div></details>
    <details><summary>Assumptions used for estimates</summary><div class="panel" id="assump-panel" style="margin-top:8px"></div></details>
  </div>
</div>
</div>

<div class="overlay" id="overlay"></div>
<div class="drawer" id="drawer"></div>
<div class="toast" id="toast"></div>

const b64bytes = b64 => { const bin=atob(b64); const u=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i); return u; };
async function gunzip(bytes){
  if (typeof DecompressionStream === "undefined") throw new Error("This browser can't unpack the archive (needs DecompressionStream; Chrome 80+, Edge 80+, Safari 16.4+, Firefox 113+).");
  const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"));
  return JSON.parse(await new Response(stream).text());
}
function askPassword(message){
  return new Promise(resolve=>{
    const box=document.getElementById("loading");
    box.innerHTML=`<form id="pwform" style="max-width:360px;margin:0 auto;text-align:left">
      <h2 style="margin-bottom:6px;color:var(--text);font-size:20px">Deal Screener</h2>
      <div class="hint" style="margin-bottom:14px">${esc(message||"This page is encrypted. Enter the dashboard password.")}</div>
      <input type="password" id="pw" autocomplete="current-password" placeholder="Password" style="width:100%;margin-bottom:10px" autofocus>
      <button class="btn primary" type="submit" style="width:100%">Unlock</button></form>`;
    const f=document.getElementById("pwform"); f.addEventListener("submit",e=>{e.preventDefault(); resolve(document.getElementById("pw").value);});
    document.getElementById("pw").focus();
  });
}
async function decrypt(header){
  const [, , iters, saltB, ivB, ctB] = header.split(":");
  const salt=b64bytes(saltB), iv=b64bytes(ivB), ct=b64bytes(ctB);
  let msg=null;
  for(;;){
    const pw = await askPassword(msg);
    if(!pw){ msg="Enter the password."; continue; }
    document.getElementById("loading").textContent="Unlocking…";
    try{
      const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
      const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt, iterations:Number(iters), hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
      const plain = await crypto.subtle.decrypt({name:"AES-GCM", iv}, key, ct);
      return new Uint8Array(plain);
    }catch(e){ msg="Wrong password. Try again."; }
  }
}
async function unpack(){
  const blob = document.getElementById("deal-data").textContent.trim();
  if (blob.startsWith("enc:v1:")){
    if (!window.isSecureContext) throw new Error("Encrypted dashboards need https:// or a local file; this page was opened over plain http.");
    return gunzip(await decrypt(blob));
  }
  return gunzip(b64bytes(blob));
}

function val(l,k){
  if (k==="rent_to_price_pct") return l.rent_to_price==null?null:l.rent_to_price*100;
  if (k==="source_count") return (l.sources||[]).length;
  if (k==="needs_review") return l.needs_review?"true":"false";
  if (k==="condition_notes") return (l.condition_notes||[]).join("; ")||null;
  if (k==="received_at") return dayOf(l.last_seen||l.received_at);
  if (k==="first_seen_date") return dayOf(l.first_seen);
  if (k==="source_urls_text") return (l.source_urls||[]).join(" ")||null;
  if (k==="extraction_warnings_text") return (l.extraction_warnings||[]).join("; ")||null;
  if (k==="validation_issues_text") return (l.validation_issues||[]).join("; ")||null;
  const v = l[k]; return v===""?null:v;
}

// ---------- filter evaluation (plain code; a null field is "missing", never a reject) ----------
function evalCond(l,c){
  const v = val(l,c.field);
  if (c.op==="empty") return v==null?"pass":"fail";
  if (c.op==="notempty") return v==null?"fail":"pass";
  if (v==null) return "missing";
  const f = FIELD[c.field]; const t=f.t;
  if (t==="num"||t==="money"){
    const n=Number(v), x=Number(c.value); if (c.value===""||isNaN(x)) return "pass";
    return ({"==":n===x,"!=":n!==x,"<":n<x,"<=":n<=x,">":n>x,">=":n>=x})[c.op]?"pass":"fail";
  }
  if (t==="date"){
    if (!c.value) return "pass"; const a=String(v), b=String(c.value);
    return ({"==":a===b,"<":a<b,">":a>b})[c.op]?"pass":"fail";
  }
  if (c.op==="in"||c.op==="notin"){                // pick several values: any one of them matches
    const set=(Array.isArray(c.value)?c.value:(c.value?[c.value]:[])).map(x=>String(x).toLowerCase());
    if (!set.length) return "pass";                 // nothing ticked yet: condition is inactive
    const hit=set.includes(String(v).toLowerCase());
    return (c.op==="in"?hit:!hit)?"pass":"fail";
  }
  const a=String(v).toLowerCase(), b=String(Array.isArray(c.value)?(c.value[0]??""):(c.value??"")).toLowerCase();
  if (b==="") return "pass";                      // no value entered yet: condition is inactive
  if (c.op==="contains") return a.includes(b)?"pass":"fail";
  if (c.op==="startswith") return a.startsWith(b)?"pass":"fail";
  if (c.op==="==") return a===b?"pass":"fail";
  if (c.op==="!=") return a!==b?"pass":"fail";
  return "pass";
}
function evalListing(l){
  const active = groups.map(g=>g.filter(c=>c.field)).filter(g=>g.length);
  if (!active.length) return {r:"match"};
  let anyMissing=false, missing=new Set();
  for (const g of active){
    let fail=false, miss=[];
    for (const c of g){ const r=evalCond(l,c); if (r==="fail"){fail=true;break;} if (r==="missing") miss.push(c.field); }
    if (fail) continue;
    if (!miss.length) return {r:"match"};
    anyMissing=true; miss.forEach(m=>missing.add(m));
  }
  return anyMissing?{r:"missing",fields:[...missing]}:{r:"reject"};
}

// ---------- scope (date range) ----------
function inScope(l){
  const s=$("#scope").value, d=l.last_seen||l.received_at||""; const day=dayOf(d);
  const today=dayOf(DATA.generated_at); const latest=DATA.runs[0]&&DATA.runs[0].run_id;
  if (s==="latest") return l.last_run_id===latest || l.first_run_id===latest;
  if (s==="today") return day===today;
  if (s==="all") return true;
  if (s==="custom"){ const a=$("#from").value, b=$("#to").value; return (!a||day>=a)&&(!b||day<=b); }
  const n=Number(s); const cut=new Date(DATA.generated_at); cut.setDate(cut.getDate()-n);
  const local=cut.getFullYear()+"-"+String(cut.getMonth()+1).padStart(2,"0")+"-"+String(cut.getDate()).padStart(2,"0");
  return day>=local;
}

  const stats=[
    ["Listings in archive", LISTINGS.length, `since ${fmtDate(DATA.install_at)}`, "Every property ever extracted, kept forever. The same property from several emails counts once."],
    ["New in latest run", r?r.listings_new:0, r?`${r.listings_extracted} extracted`:"", "Properties the latest run had never seen before. 'Extracted' also counts repeats of known properties."],
    ["Emails, latest run", r?r.emails_seen:0, r?`${r.emails_with_listings} had listings`:"", "New emails the latest run looked at, and how many of them contained at least one property."],
    ["Couldn't read, latest run", r?r.emails_failed:0, r?`${r.fetch_failures} fetch failures`:"", "Emails with no readable text or that the AI couldn't turn into valid data, plus listing links that wouldn't load. Details in the 'Couldn't read' section."],
    ["Need review, latest run", r?r.validation_failures:0, "", "Listings that failed a plain-code sanity check in the latest run. Each says why."],
    ["All time", tot.seen, `emails · ${tot.l} listings · ${tot.f} failed`, "Totals across every run since day one."],

// ---------- render: filter builder ----------
function enumVals(k){
  const f=FIELD[k]; if (f.vals) return f.vals;
  const s=new Set(); LISTINGS.forEach(l=>{const v=val(l,k); if(v!=null) s.add(String(v));}); return [...s].sort();
}
function renderGroups(){
  const host=$("#groups"); host.innerHTML="";
  if (!groups.length) groups=[[{field:"",op:"",value:""}]];
  groups.forEach((g,gi)=>{
    if (gi>0){ const o=document.createElement("div"); o.className="or"; o.textContent="or"; host.appendChild(o); }
    const box=document.createElement("div"); box.className="group";
    box.innerHTML=`<span class="glabel">Group ${gi+1}${groups.length>1?' — all of these':''}</span>`;
    g.forEach((c,ci)=>{
      const row=document.createElement("div"); row.className="cond";
      const fs=document.createElement("select");
      fs.innerHTML='<option value="">— pick a field —</option>'+groupedOptions(c.field);
      fs.dataset.tip="The field to test. 'Stated numbers' come from the email; 'Derived (code)' are calculated from them. A blank field never fails a condition: the listing goes to 'Missing data' instead.";
      const os=document.createElement("select"); const vi=document.createElement("span");
      const rm=document.createElement("button"); rm.className="btn small ghost"; rm.textContent="×"; rm.dataset.tip="Remove this condition.";
      const refresh=()=>{
        const f=FIELD[c.field];
        os.innerHTML = f ? OPS[f.t].map(([v,l])=>`<option value="${v}" ${c.op===v?"selected":""}>${l}</option>`).join("") : "";
        if (f && !OPS[f.t].some(([v])=>v===c.op)) c.op=OPS[f.t][0][0];
        os.value=c.op; vi.innerHTML="";
        if (f && c.op!=="empty" && c.op!=="notempty"){
          let inp;
          if (f.t==="enum" && (c.op==="in"||c.op==="notin")){
            if (!Array.isArray(c.value)) c.value = c.value ? [c.value] : [];
            const box=document.createElement("div"); box.className="multi";
            box.dataset.tip = c.op==="in" ? "Tick every value you want. A listing passes if it is ANY of the ticked values." : "Tick values to exclude. A listing passes if it is NONE of the ticked values.";
            for (const v of enumVals(c.field)){
              const lab=document.createElement("label"); const cb=document.createElement("input"); cb.type="checkbox"; cb.checked=c.value.includes(v);
              cb.addEventListener("change",()=>{ c.value = cb.checked ? [...c.value.filter(x=>x!==v), v] : c.value.filter(x=>x!==v); apply(); });
              lab.append(cb, document.createTextNode(" "+(ENUM_LABEL[v]||v))); box.appendChild(lab);
            }
            vi.appendChild(box); return;
          }
          if (f.t==="enum"){ if (Array.isArray(c.value)) c.value=c.value[0]??""; inp=document.createElement("select"); inp.innerHTML='<option value="">— choose —</option>'+enumVals(c.field).map(v=>`<option value="${esc(v)}" ${c.value===v?"selected":""}>${esc(v)}</option>`).join(""); }
          else if (f.t==="num"||f.t==="money"){ inp=document.createElement("input"); inp.type="number"; inp.step="any"; inp.value=c.value??""; inp.placeholder=f.t==="money"?"dollars":"number"; }
          else if (f.t==="date"){ inp=document.createElement("input"); inp.type="date"; inp.value=c.value??""; }
          else { inp=document.createElement("input"); inp.type="text"; inp.value=c.value??""; inp.placeholder="text"; }
          inp.style.width="100%"; inp.addEventListener("input",()=>{c.value=inp.value; apply();}); inp.addEventListener("change",()=>{c.value=inp.value; apply();});
          vi.appendChild(inp);
          if (f.t==="num"||f.t==="money"){
            // A number box silently stores "" for anything that isn't a number ("1%"), and an empty
            // value makes the condition pass everything. Say so, right here, instead of staying quiet.
            const w=document.createElement("div"); w.className="missing"; w.style.marginTop="4px";
            const upd=()=>{ w.textContent = inp.validity.badInput ? "Numbers only: type 1 for the 1% rule, not 1%." :
                                            inp.value==="" ? "Enter a number. Until then this condition is ignored and every listing passes it." : ""; };
            upd(); inp.addEventListener("input",upd); vi.appendChild(w);
          }
        }
      };
      fs.addEventListener("change",()=>{c.field=fs.value; c.value=""; c.op=""; refresh(); apply();});
      os.addEventListener("change",()=>{c.op=os.value; refresh(); apply();});
      rm.addEventListener("click",()=>{g.splice(ci,1); if(!g.length) groups.splice(gi,1); renderGroups(); apply();});
      refresh(); row.append(fs,os,vi,rm); box.appendChild(row);
    });
    const add=document.createElement("button"); add.className="btn small ghost"; add.textContent="+ and condition"; add.style.marginTop="8px";
    add.addEventListener("click",()=>{g.push({field:"",op:"",value:""}); renderGroups();});
    box.appendChild(add); host.appendChild(box);
  });
}
function groupedOptions(sel){
  const gs=[...new Set(FIELDS.map(f=>f.g))];
  return gs.map(g=>`<optgroup label="${esc(g)}">`+FIELDS.filter(f=>f.g===g).map(f=>`<option value="${f.k}" ${sel===f.k?"selected":""}>${esc(f.label)}</option>`).join("")+"</optgroup>").join("");
}

}

function rentBadge(l){ const t=l.metrics_rent_type||l.rent_type||"unknown"; const cls=t==="actual"?"ok":t==="pro_forma"?"warn":t==="estimate"?"est":"gray"; const tip=t==="actual"?"ACTUAL: the email describes current leases or a rent roll.":t==="pro_forma"?"PRO FORMA: the sender's projection or estimate (market rent, post-rehab rent, rent in their own deal analysis). Not a signed lease.":t==="estimate"?("ESTIMATE: the email states no rent. Plain code used HUD's Fair Market Rent, or the US Census median rent, for the area and unit size"+((l.rent_estimate||{}).basis?" ("+(l.rent_estimate||{}).basis+")":"")+". A rough first screen, not this property's rent."):"UNKNOWN: the email gives a rent but doesn't say whether it's current leases or a projection. Click the row to read the wording.";
  return `<span class="badge ${cls}" data-tip="${esc(tip)}">${t==="pro_forma"?"pro forma":t}</span>`; }
function renderTable(name, rows, extraCol){
  const t=$("#t-"+name), [sk,dir]=sortState[name];
  const cols=extraCol?[...COLS,extraCol]:COLS;
  const col=cols.find(c=>c.k===sk)||COLS[COLS.length-2];
  rows=rows.slice().sort((a,b)=>{ const x=col.sort(a.l||a), y=col.sort(b.l||b); if(x==null&&y==null)return 0; if(x==null)return 1; if(y==null)return -1; return (x<y?-1:x>y?1:0)*dir; });
  const per=100, pg=Math.min(pages[name], Math.max(0,Math.ceil(rows.length/per)-1)); pages[name]=pg;
  const slice=rows.slice(pg*per,(pg+1)*per);
  t.innerHTML=`<thead><tr>${cols.map(c=>`<th class="${c.num?"num":""} ${c.k===sk?"sorted":""}" data-k="${c.k}" data-tip="${esc((COLTIPS[c.k]||"")+" Click to sort.")}">${esc(c.label)}${c.k===sk?`<span class="arrow">${dir>0?"▲":"▼"}</span>`:""}</th>`).join("")}</tr></thead>`+
    `<tbody>${slice.map(r=>{const l=r.l||r; return `<tr data-id="${l.id}" class="${l.id===selectedId?"selected":""}">${cols.map(c=>{const h=c.render(l,r); return `<td class="${c.num?"num":""} ${h===""?"blank":""}">${h===""?"—":h}</td>`;}).join("")}</tr>`;}).join("")}</tbody>`;
  t.querySelectorAll("th").forEach(th=>th.addEventListener("click",()=>{ const k=th.dataset.k; sortState[name]= sortState[name][0]===k?[k,-sortState[name][1]]:[k,k==="address"||k==="sender_name"||k==="property_type"?1:-1]; apply(); }));
  t.querySelectorAll("tbody tr").forEach(tr=>tr.addEventListener("click",()=>openDrawer(Number(tr.dataset.id))));
  const p=$("#p-"+name); const n=Math.ceil(rows.length/per);
  p.innerHTML = rows.length? (n>1?`<button class="btn small" ${pg===0?"disabled":""} data-d="-1">‹ prev</button> page ${pg+1} of ${n} (${rows.length} rows) <button class="btn small" ${pg>=n-1?"disabled":""} data-d="1">next ›</button>`:`${rows.length} row${rows.length===1?"":"s"}`) : "";
  p.querySelectorAll("button").forEach(b=>b.addEventListener("click",()=>{pages[name]+=Number(b.dataset.d); apply();}));
  if (!rows.length){ const tb=t.querySelector("tbody"); tb.innerHTML=`<tr><td colspan="${cols.length}" class="empty">${name==="matches"?"Nothing matches in this range.":"Nothing here."}</td></tr>`; }
}

// ---------- render: review / unreadable / skipped ----------
function emailLine(e, extra){
  return `<li><div class="m">${esc(fmtDT(e.received_at))}<br>${esc(e.sender_name||e.sender_email||"")}</div><div><b>${esc(e.subject||"(no subject)")}</b> ${extra||""}<div class="m">${esc(e.detail||e.reason||"")}</div>${e.excerpt?`<div class="m" style="margin-top:4px">${esc(e.excerpt)}</div>`:""}</div></li>`;
}
function renderReview(reviewListings){
  const latest=DATA.runs[0]&&DATA.runs[0].run_id;
  const failed=DATA.emails.filter(e=>e.status==="failed");
  const unread=DATA.unreadable;
  const byUid={}; unread.forEach(u=>{ (byUid[u.email_uid]=byUid[u.email_uid]||[]).push(u); });
  let html="";
  html+=`<h3 style="margin-top:0">Listings flagged by validation (${reviewListings.length} in range)</h3>`;
  html+= reviewListings.length ? `<div class="tablewrap"><table id="t-review"></table><div class="pager" id="p-review"></div></div>` : `<div class="hint">None in this range.</div>`;
  html+=`<h3>Emails that couldn't be read (last ${DATA.config.email_log_days} days: ${failed.length})</h3>`;
  html+= failed.length ? `<ul class="list">${failed.slice(0,300).map(e=>emailLine(e, (byUid[e.uid]||[]).map(u=>`<span class="pill">${esc(u.reason)}</span>`).join(""))).join("")}</ul>` : `<div class="hint">None.</div>`;
  const partial=unread.filter(u=>!failed.some(e=>e.uid===u.email_uid));
  html+=`<h3>Partial fetch failures on emails that still produced data (${partial.length})</h3>`;
  html+= partial.length ? `<ul class="list">${partial.slice(0,300).map(u=>`<li><div class="m">${esc(fmtDT(u.received_at||u.created_at))}<br>${esc(u.sender_name||"")}</div><div><b>${esc(u.subject||"uid "+u.email_uid)}</b><div class="m">${esc(u.reason)}</div></div></li>`).join("")}</ul>` : `<div class="hint">None.</div>`;
  $("#review-panel").innerHTML=html;
  $("#c-review").textContent=`${reviewListings.length} listing(s) · ${failed.length} unreadable email(s)`;
  if (reviewListings.length){
    renderTable("review", reviewListings, {k:"issues",label:"Issues",render:l=>`<span class="missing">${esc((l.validation_issues||[]).join("; "))}</span>`,sort:l=>(l.validation_issues||[]).length});
  }
  const sk=DATA.emails.filter(e=>e.status==="skipped"), np=DATA.emails.filter(e=>e.status==="no_property");
  $("#s-skipped").textContent=`Skipped by the plain-code prescreen, never sent to the AI (last ${DATA.config.email_log_days} days: ${sk.length}) — check this if something real went missing`;
  $("#skipped-panel").innerHTML= sk.length?`<ul class="list">${sk.slice(0,300).map(e=>emailLine(e)).join("")}</ul>`:`<div class="hint">None.</div>`;
  $("#s-noprop").textContent=`Sent to the AI, no property found (last ${DATA.config.email_log_days} days: ${np.length})`;
  $("#noprop-panel").innerHTML= np.length?`<ul class="list">${np.slice(0,300).map(e=>emailLine(e)).join("")}</ul>`:`<div class="hint">None.</div>`;
  const er=DATA.config.expense_ratio;
  $("#assump-panel").innerHTML=`<div class="hint" style="margin-bottom:8px">est_noi = monthly rent × 12 × (1 − ratio); est_cap = est_noi ÷ price. These are fixed numbers from config.toml, not derived from any listing. The AI never sees them.</div><div class="kv">${Object.entries(er).map(([k,v])=>`<div class="k">${esc(k)}</div><div class="v">${(v*100).toFixed(1)}%</div>`).join("")}</div>`;
}

// ---------- drawer ----------
const DRAWER_GROUPS=[
  ["Address",["street","city","state","zip"]],
  ["Property",["property_type","mobile_home_tenancy","unit_count","total_beds","beds_per_unit","vacant_units","total_baths","building_sqft","lot_sqft","year_built"]],
  ["Stated numbers",["asking_price","gross_monthly_rent","gross_annual_rent","rent_type","annual_taxes","annual_insurance","monthly_hoa","noi_stated","cap_rate_stated","occupancy_pct"]],
  ["Listing",["listing_status","days_on_market","deal_type"]],
];
function fmtField(k,v){ const f=FIELD[k]; if(v==null) return `<span class="hint">—</span>`; if(k==="year_built") return esc(v); if(f&&f.t==="money") return fmtMoney(v); if(k==="cap_rate_stated"||k==="occupancy_pct") return fmtPct(v,2); if(f&&(f.t==="num")) return fmtNum(v,2); return esc(v); }
function openDrawer(id){
  const l=LISTINGS.find(x=>x.id===id); if(!l) return; selectedId=id;
  const ev=l.evidence||{};
  let h=`<button class="btn small close" id="closedrawer">close ✕</button>`;
  h+=`<h2 style="font-size:18px;margin-top:4px">${esc(l.street||"(no street)")}</h2><div class="sub">${esc([l.city,l.state,l.zip].filter(Boolean).join(", "))} · ${esc(l.property_type||"")} ${rentBadge(l)} ${l.needs_review?'<span class="badge bad">needs review</span>':""}</div>`;
  for (const [g,keys] of DRAWER_GROUPS){
    h+=`<h3>${g}</h3><div class="kv">`;
    for (const k of keys){
      const v=l[k]; const isEnumUnknown=(v==="unknown");
      h+=`<div class="k">${esc(label(k))}</div><div class="v">${fmtField(k,v)}</div>`;
      if (v!=null && !isEnumUnknown) h+= ev[k]?`<div class="ev">“${esc(ev[k])}”</div>`:`<div class="ev none">no evidence snippet recorded</div>`;
    }
    h+=`</div>`;
  }
  if ((l.condition_notes||[]).length) h+=`<h3>Condition notes (verbatim)</h3><div>${l.condition_notes.map(c=>`<span class="pill">${esc(c)}</span>`).join("")}</div>`;
  h+=`<div class="hint" style="margin-top:10px">Read by: <b>${l.extracted_by==="ai"?"the AI (code couldn't read this email completely)":l.extracted_by==="code"?"plain code (no AI)":"the AI"}</b></div>`;
  const nb=l.neighborhood;
  if(nb){
    h+=`<h3>Neighborhood (US Census, RentalMath method)</h3>`;
    if(nb.grade && nb.grade!=="N/A"){
      h+=`<div class="row" style="gap:12px;margin-bottom:8px">${gradeBadge(l)}<div><b>${esc(nb.grade_name||"")}</b><div class="hint">${esc(nb.quality||"")} · ${esc(nb.confidence||"")} (${esc(nb.data_completeness)} metrics) · score ${nb.economic_score} of 4</div></div></div>`;
      if(nb.capped) h+=`<div class="hint" style="color:var(--amber);margin-bottom:6px">${esc(nb.capped)}</div>`;
      const I=nb.inputs||{}, S=nb.sub_scores||{};
      const rows=[["Median household income",I.medianIncome!=null?fmtMoney(I.medianIncome)+` <span class="hint">vs ${fmtMoney(I.localMedianIncome)} county</span>`:null,S.income],
        ["Poverty rate",I.povertyRate!=null?fmtPct(I.povertyRate,1):null,S.poverty],
        ["Owner-occupied / other vacant",I.ownerOccupied!=null||I.otherVacantPct!=null?`${I.ownerOccupied!=null?fmtPct(I.ownerOccupied,1):"—"} / ${I.otherVacantPct!=null?fmtPct(I.otherVacantPct,2):"—"}`:null,S.blightComposite],
        ["Unemployment (ZIP)",I.unemploymentRate!=null?fmtPct(I.unemploymentRate,1):null,S.employmentHealth],
        ["Master's degree or higher",I.eduMastersPlus!=null?fmtPct(I.eduMastersPlus,1):null,S.educationDemand],
        ["Inequality (Gini, counted when poverty > 15%)",I.giniIndex!=null?I.giniIndex.toFixed(3):null,S.giniProxy],
        [nb.walk_source||"Walk Score",nb.walk_score!=null?nb.walk_score:null,S.walkability],
        ["Rental vacancy",I.rentalVacancyRate!=null?fmtPct(I.rentalVacancyRate,1):null,S.rentalTightness]];
      h+=`<div class="kv">`+rows.map(([k,v,sc])=>`<div class="k">${esc(k)}</div><div class="v">${v==null?'<span class="hint">no data</span>':v}${sc!=null?` <span class="hint">→ ${sc}/4</span>`:""}</div>`).join("")+`</div>`;
      h+=`<div class="hint" style="margin-top:6px">Census tract ${esc(nb.tract||"")}, ${esc(String(nb.acs_year||""))} ACS 5-year. ${esc(nb.not_included||"")}.</div>`;
    } else {
      h+=`<div class="hint">No grade: ${esc(nb.note||"not enough neighborhood data")}.</div>`;
    }
    if(nb.risk_grade){
      const fl=nb.flood, nr=nb.nri;
      h+=`<div class="kv" style="margin-top:8px"><div class="k">Climate / flood risk grade</div><div class="v"><b>${esc(nb.risk_grade)}</b> <span class="hint">${fl?`flood zone ${esc(fl.zone||"?")}${fl.sfha?" (SFHA, flood insurance required)":""}`:"flood zone unknown"}${nr&&nr.RISK_SCORE!=null?` · FEMA risk index ${Number(nr.RISK_SCORE).toFixed(0)} (${esc(nr.RISK_RATNG||"")})`:""}</span></div></div>`;
    }
    if((nb.flags||[]).length) h+=`<ul class="warn-list" style="margin-top:6px">${nb.flags.map(f=>`<li><b>${esc(f.label)}</b>: ${esc(f.detail)}</li>`).join("")}</ul>`;
  }
  h+=`<h3>Derived by code (not by the AI)</h3><div class="kv">`;
  const d=[["monthly_rent_used",`${fmtMoney(l.monthly_rent_used)}${l.monthly_rent_source?` <span class="hint">(${esc(l.monthly_rent_source)})</span>`:""}`],
           ["price_per_unit",fmtMoney(l.price_per_unit)],["price_per_sqft",l.price_per_sqft==null?"":"$"+fmtNum(l.price_per_sqft,2)],
           ["rent_to_price_pct",l.rent_to_price==null?"":fmtPct(l.rent_to_price*100,3)+" <span class='hint'>of price per month</span>"],["grm",fmtNum(l.grm,2)],
           ["est_noi",l.est_noi==null?"":`${fmtMoney(l.est_noi)} <span class="badge gray">estimated</span> <span class="hint">${(l.expense_ratio_used*100).toFixed(1)}% expenses (${esc(l.expense_ratio_key)})</span>`],
           ["est_cap_rate",l.est_cap_rate==null?"":`${fmtPct(l.est_cap_rate)} <span class="badge gray">estimated</span>`],
           ["metrics_rent_type",rentBadge(l)]];
  for (const [k,v] of d) h+=`<div class="k">${esc(label(k))}</div><div class="v">${v||'<span class="hint">— (input missing)</span>'}</div>`;
  const re_=l.rent_estimate||{};
  if (!re_.monthly && re_.note && !l.monthly_rent_used) h+=`<div class="k">Area rent estimate</div><div class="v"><span class="hint">${esc(re_.note)}</span></div>`;
  if (re_.monthly && l.metrics_rent_type!=="estimate" && l.monthly_rent_used) h+=`<div class="k">Area rent estimate, for comparison</div><div class="v">${fmtMoney(re_.monthly)} <span class="badge est">est</span> <span class="hint">${(re_.monthly/l.monthly_rent_used).toFixed(2)}x the stated rent. Plain code from public data, not this property's rent: ${esc(re_.basis||"")}</span></div>`;
  h+=`</div>`;
  if ((l.validation_issues||[]).length) h+=`<h3>Validation issues</h3><ul class="issue-list">${l.validation_issues.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`;
  if ((l.extraction_warnings||[]).length) h+=`<h3>Extraction warnings (from the AI)</h3><ul class="warn-list">${l.extraction_warnings.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`;
  const srcs=l.sources||[]; const prices=[...new Set(srcs.map(s=>s.asking_price).filter(p=>p!=null))];
  h+=`<h3>Sources (${srcs.length})${prices.length>1?` <span class="diff">— ${prices.length} different prices</span>`:""}</h3><ul class="list">`;
  for (const s of srcs) h+=`<li><div class="m">${esc(fmtDT(s.received_at))}</div><div>${esc(s.sender_name||"")} <span class="hint">${esc(s.sender_email||"")}</span> · <span class="${prices.length>1?"diff":""}">${fmtMoney(s.asking_price)||"no price"}</span>${(s.urls||[]).length?`<div>${s.urls.map(u=>`<a href="${esc(u)}" target="_blank" rel="noopener">${esc(u.replace(/^https?:\/\//,"").slice(0,70))}</a>`).join("<br>")}</div>`:""}</li>`;
  h+=`</ul>`;
  if ((l.other_urls||[]).length) h+=`<h3>Other links in the email (not fetched)</h3><div>${l.other_urls.map(u=>`<a href="${esc(u)}" target="_blank" rel="noopener">${esc(u.replace(/^https?:\/\//,"").slice(0,80))}</a>`).join("<br>")}</div>`;
  h+=`<h3>Email</h3><div class="hint">Subject: ${esc(l.email_subject||"")} · first seen ${esc(fmtDT(l.first_seen))}${l.last_seen!==l.first_seen?`, last ${esc(fmtDT(l.last_seen))}`:""}</div>`;
  if (l.email_excerpt) h+=`<pre class="excerpt" style="margin-top:6px">${esc(l.email_excerpt)}</pre>`;
  const dr=$("#drawer"); dr.innerHTML=h; dr.classList.add("open"); $("#overlay").classList.add("open");
  $("#closedrawer").addEventListener("click",closeDrawer);
}
function closeDrawer(){ $("#drawer").classList.remove("open"); $("#overlay").classList.remove("open"); selectedId=null; }

// ---------- apply ----------
function apply(){
  const incl=$("#inclreview").checked;
  const scoped=LISTINGS.filter(inScope);
  const review=scoped.filter(l=>l.needs_review);
  const sold=scoped.filter(l=>l.listing_status==="sold").length;          // not for sale: never in the tables
  const pool=(incl?scoped:scoped.filter(l=>!l.needs_review)).filter(l=>l.listing_status!=="sold");
  const matches=[], missing=[], rejects=[];
  for (const l of pool){ const r=evalListing(l); if(r.r==="match") matches.push(l); else if(r.r==="missing") missing.push({l,fields:r.fields}); else rejects.push(l); }
  const active=cleanGroups();
  $("#c-matches").textContent=`${matches.length} of ${pool.length}`;
  $("#c-missing").textContent=`${missing.length}`;
  const incomplete=active.reduce((a,g)=>a+g.filter(c=>c.op!=="empty"&&c.op!=="notempty"&&(c.value===""||c.value==null||(Array.isArray(c.value)&&!c.value.length)||((FIELD[c.field]||{}).t==="num"||(FIELD[c.field]||{}).t==="money")&&isNaN(Number(c.value)))).length,0);
  $("#filterstate").textContent= active.length?`${active.reduce((a,g)=>a+g.length,0)} condition(s) in ${active.length} group(s)`+(incomplete?` · ${incomplete} with no value, ignored (every listing passes it)`:""):"no filter — showing everything in range";
  $("#filterstate").style.color= incomplete?"var(--amber)":"";

  $("#sec-missing").style.display= active.length?"":"none";
  renderTable("matches",matches);
  renderTable("missing",missing,{k:"missing",label:"Missing field(s)",render:(l,r)=>`<span class="missing">${esc((r.fields||[]).map(label).join(", "))}</span>`,sort:(l)=>0});
  $("#s-rejects").textContent=`Rejected by the filter (${rejects.length})`;
  renderTable("rejects",rejects);
  renderReview(review);
  const s=$("#scope").value;
  $("#scopehint").textContent=`${scoped.length} listing(s) in range${!incl&&review.length?`, ${review.length} held in "needs review"`:""}${sold?`, ${sold} sold (hidden: their pages were sold listings, not homes for sale)`:""}`;
}

// ---------- tooltips (one floating box, never clipped by scrolling tables) ----------
(function(){
  const box=document.getElementById("tip"); let cur=null, hideT=null;
  function show(el){
    const t=el.getAttribute("data-tip"); if(!t) return;
    cur=el; box.textContent=t; box.classList.add("on");
    const r=el.getBoundingClientRect(), b=box.getBoundingClientRect(), pad=8;
    const x=Math.min(Math.max(pad, r.left + r.width/2 - b.width/2), innerWidth - b.width - pad);
    let y=r.bottom + 8; if (y + b.height > innerHeight - pad) y = r.top - b.height - 8;
    box.style.left=x+"px"; box.style.top=Math.max(pad,y)+"px";
  }
  function hide(){ cur=null; box.classList.remove("on"); box.style.left="-9999px"; }
  document.addEventListener("mouseover",e=>{ const el=e.target.closest("[data-tip]"); if(el && el!==cur) show(el); else if(!el && cur) hide(); });
  document.addEventListener("focusin",e=>{ const el=e.target.closest("[data-tip]"); if(el) show(el); });
  document.addEventListener("focusout",hide);
  document.addEventListener("scroll",hide,true);
  let lp=null;   // touch: long-press shows the tip without sorting or opening the row
  document.addEventListener("touchstart",e=>{ const el=e.target.closest("[data-tip]"); clearTimeout(lp); if(!el) return hide();
    lp=setTimeout(()=>{ show(el); clearTimeout(hideT); hideT=setTimeout(hide,4000); },450); },{passive:true});
  document.addEventListener("touchend",()=>clearTimeout(lp),{passive:true});
})();

// ---------- boot ----------
async function boot(){
  try{ DATA=await unpack(); }catch(e){ $("#loading").innerHTML=`<b>Couldn't open the archive.</b><br>${esc(e.message)}`; return; }
  LISTINGS=DATA.listings;
  $("#loading").style.display="none"; $("#app").style.display="";
  renderHeader(); renderGroups(); renderSaved(); apply();
  $("#scope").addEventListener("change",()=>{ $("#customrange").style.display=$("#scope").value==="custom"?"":"none"; pages={matches:0,missing:0,rejects:0,review:0}; apply(); });
  $("#from").addEventListener("change",apply); $("#to").addEventListener("change",apply);
  $("#inclreview").addEventListener("change",apply);
  $("#addgroup").addEventListener("click",()=>{ groups.push([{field:"",op:"",value:""}]); renderGroups(); });
  $("#clearbtn").addEventListener("click",()=>{
    groups=[]; $("#savedsets").value="";
    $("#scope").value="latest"; $("#customrange").style.display="none"; $("#from").value=""; $("#to").value="";
    $("#inclreview").checked=false;
    sortState={matches:["received_at",-1], missing:["received_at",-1], rejects:["received_at",-1], review:["received_at",-1]};
    pages={matches:0,missing:0,rejects:0,review:0};
    renderGroups(); apply(); toast("Reset to default view");
  });
  $("#savebtn").addEventListener("click",()=>{ const g=cleanGroups(); if(!g.length){toast("Build a filter first");return;} const name=prompt("Name this filter set:", $("#savedsets").value||""); if(!name) return; const s=loadSaved(); s[name]=g; if(storeSaved(s)){ renderSaved(); $("#savedsets").value=name; toast(`Saved "${name}" in this browser`); } });
  $("#deletebtn").addEventListener("click",()=>{ const n=$("#savedsets").value; if(!n) return; if(!confirm(`Delete saved set "${n}"?`)) return; const s=loadSaved(); delete s[n]; storeSaved(s); renderSaved(); toast("Deleted"); });
  $("#savedsets").addEventListener("change",()=>{ const n=$("#savedsets").value; const s=loadSaved(); if(s[n]){ groups=JSON.parse(JSON.stringify(s[n])); renderGroups(); apply(); } });
  $("#exportbtn").addEventListener("click",()=>{ const s=loadSaved(); const blob=new Blob([JSON.stringify({version:1,exported_at:new Date().toISOString(),sets:s},null,2)],{type:"application/json"}); const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="deal-screener-filters.json"; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),2000); toast(`Exported ${Object.keys(s).length} set(s)`); });
  $("#importbtn").addEventListener("click",()=>$("#importfile").click());
  $("#importfile").addEventListener("change",async()=>{ const f=$("#importfile").files[0]; if(!f) return; try{ const j=JSON.parse(await f.text()); const sets=j.sets||j; if(typeof sets!=="object") throw new Error("not a filters file"); const s=loadSaved(); let n=0; for(const [k,v] of Object.entries(sets)){ if(Array.isArray(v)){ s[k]=v; n++; } } storeSaved(s); renderSaved(); toast(`Imported ${n} set(s)`); }catch(e){ toast("Import failed: "+e.message); } $("#importfile").value=""; });
  $("#overlay").addEventListener("click",closeDrawer);
  document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeDrawer(); });
}
boot();
</script>
